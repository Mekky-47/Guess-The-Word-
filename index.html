<!doctype html>
<html lang="en">
    <head>
        <title>Guess Word</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous"/>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body >
        <main class="vh-100">
            <header class="py-4 bg-white">
                <h2 class="text-center ">Guess The Word</h2>
            </header>
            <section class="game-section pt-5">
                    <div class="container ">
                    <div class="row ">
                        <div class="game col-lg-6  col-sm-12 d-flex flex-column align-items-center">
                            <div class="inputs">
                            </div>
                            <div class="btns mt-3 w-75 justify-content-center gap-3 d-flex ">
                                <button class="btn btn-danger col-4 check " id="check-btn">check Word</button>
                                <button class="btn btn-outline-primary hint" id="hint" ><span></span>Hint</button>
                            </div>
                        </div>
                        <div class=" col-lg-6 col-sm-12 d-flex flex-column align-items-center justify-content-between " >
                            <div class="keys-color d-flex flex-column gap-2 mt-2">
                                <h3 class="text-center">Key Words</h3>
                                <div class="key-t"> <div class="key"></div> Letter is correct and in place</div>
                                <div class="key-t"> <div class="key"></div> Letter is correct and not in place</div>
                                <div class="key-t"> <div class="key"></div> Letter is wrong </div>
                            </div>
                            <div class="display" id="display">
                                <p class="text-center fw-bold h5">You have to guess the word in <span class="text-danger ">6</span> letters</p>
                                <p class="text-center fw-bold h5">Should Fill All Inputs</p>
                                
                            </div>
                        </div>
                    </div>
            </section>
                </div>
            </main>
            
            <footer>Guess The Word Game Craeted By <span class="h6 fw-bold"><u>Mekky</u></span> </footer>
    </body>
    <script src="js/main.js"></script>
</html>
